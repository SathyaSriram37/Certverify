version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certverify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certverify}
      POSTGRES_USER: ${POSTGRES_USER:-certverify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongdbpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: certverify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: certverify_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: certverify_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - postgres
      - redis

  flower:
    image: mher/flower:latest
    container_name: certverify_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: certverify_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

